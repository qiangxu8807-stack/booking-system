<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITRI-3#2F-SIPH实验室预约系统</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { background: #fff; max-width: 700px; width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 28px; }
    h1 { font-size: 22px; text-align: center; margin-bottom: 24px; }
    label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; margin-top: 18px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 15px; box-sizing: border-box; font-family: inherit; }
    input:focus, select:focus, textarea:focus { border-color: #1677ff; outline: none; }
    button { width: 100%; margin-top: 24px; padding: 12px; background: #1677ff; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:hover { background: #0958d9; }
    button:disabled { background: #a0c4ff; cursor: not-allowed; }
    .message { margin-top: 16px; padding: 10px; border-radius: 8px; text-align: center; display: none; }
    .success { background: #e6f7e6; color: #237804; display: block; }
    .error { background: #fff1f0; color: #cf1322; display: block; }

    .btn-grid { display: grid; gap: 8px; margin-top: 6px; }
    .btn-grid.platforms { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    .btn-grid.devices { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .sel-btn { padding: 10px 8px; border: 2px solid #d9d9d9; border-radius: 8px; background: #fff; text-align: center; cursor: pointer; font-size: 13px; transition: all 0.15s; user-select: none; line-height: 1.4; position: relative; }
    .sel-btn:hover { border-color: #91caff; }
    .sel-btn.active { border-color: #1677ff; background: #e6f4ff; color: #0958d9; font-weight: 600; }
    .sel-btn.active::after { content: '✓'; position: absolute; top: 2px; right: 6px; font-size: 12px; color: #1677ff; }

    .current-sel { margin-top: 16px; padding: 10px 12px; background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 8px; font-size: 13px; color: #389e0d; display: none; }
    .current-sel.show { display: block; }
    .current-sel b { color: #237804; }

    .panel { margin-top: 32px; border-top: 1px dashed #e8e8e8; padding-top: 24px; }
    .panel-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .refresh { font-size: 13px; color: #1677ff; cursor: pointer; font-weight: normal; }
    
    .platform-group { margin-bottom: 24px; }
    .platform-header { background: #f0f7ff; padding: 12px 16px; font-size: 15px; font-weight: 600; color: #0958d9; display: flex; justify-content: space-between; align-items: center; border-radius: 8px 8px 0 0; border: 1px solid #e6f4ff; border-bottom: none; }
    .platform-header .count { color: #1677ff; font-weight: normal; font-size: 13px; background: #fff; padding: 2px 10px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .platform-body { border: 1px solid #e6f4ff; border-radius: 0 0 8px 8px; background: #fafcff; overflow: hidden; }
    
    /* 🌟 核心优化：重构列表卡片排版 */
    .record { padding: 16px; font-size: 14px; border-bottom: 1px solid #eef0f4; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; transition: background 0.2s; }
    .record:hover { background: #fff; }
    .record:last-child { border-bottom: none; }
    
    .record-left { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .record-row { display: flex; align-items: center; gap: 8px; }
    .record-row .label { font-size: 12px; color: #8c8c8c; width: 32px; flex-shrink: 0; }
    .record-row .value { color: #333; font-weight: 500; }
    
    .record-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 100px; }
    .record-right .name { color: #1677ff; font-weight: 600; font-size: 15px; }
    .record-right .phone { color: #8c8c8c; font-size: 13px; letter-spacing: 0.5px; }
    
    .btn-cancel-rec { padding: 4px 12px; font-size: 12px; background: #fff; color: #ff4d4f; border: 1px solid #ffccc7; border-radius: 4px; cursor: pointer; transition: all 0.2s; margin-top: 4px; }
    .btn-cancel-rec:hover { background: #ff4d4f; color: #fff; border-color: #ff4d4f; }

    .empty { padding: 30px; text-align: center; color: #999; font-size: 14px; background: #fafafa; border-radius: 8px; border: 1px dashed #d9d9d9; }
    .hint { margin-top: 6px; font-size: 13px; color: #fa8c16; display: none; }
    .hint.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔬 SITRI-3#2F-SIPH实验室预约系统</h1>

    <label>选择光学平台（单选）</label>
    <div class="btn-grid platforms" id="platformGrid"></div>

    <label>选择设备（可多选）</label>
    <div class="btn-grid devices" id="deviceGrid"></div>

    <div class="current-sel" id="currentSel"></div>

    <label>选择日期</label>
    <input type="date" id="date">
    <div class="hint" id="hint"></div>

    <label>选择时间段</label>
    <select id="time">
      <option value="">请选择时间段</option>
      <option>全天</option>
      <option>09:00-10:00</option>
      <option>10:00-11:00</option>
      <option>11:00-12:00</option>
      <option>14:00-15:00</option>
      <option>15:00-16:00</option>
      <option>16:00-17:00</option>
    </select>

    <label>姓名</label>
    <input type="text" id="name" placeholder="请输入您的姓名">

    <label>电话</label>
    <input type="tel" id="phone" placeholder="请输入手机号">

    <label>备注（选填）</label>
    <textarea id="note" rows="2" placeholder="例如：测试样品、时长需求等"></textarea>

    <button id="btn" onclick="submitBooking()">提交预约</button>
    <div id="msg" class="message"></div>

    <div class="panel">
      <div class="panel-title">
        <span>已预约记录</span>
        <span class="refresh" onclick="loadBookings()">🔄 刷新</span>
      </div>
      <div id="list"><div class="empty">加载中...</div></div>
    </div>
  </div>

  <script>
    const PLATFORMS = [
      { id: '1-EC', name: '1-EC' },
      { id: '2-GR', name: '2-GR' },
      { id: '3-EE', name: '3-EE' },
      { id: '4-LIDAR', name: '4-LIDAR' },
      { id: '5-EVEXIA', name: '5-EVEXIA' }
    ];

    const DEVICES = [
      { id: 'keysight-c', name: 'Keysight C-band' },
      { id: 'santec-o', name: 'Santec O-band' },
      { id: 'lca-67g', name: '67G LCA' },
      { id: 'lca-110g', name: '110G LCA' },
      { id: 'edfa', name: 'EDFA' },
      { id: 'pdfa', name: 'PDFA' },
      { id: 'yoko-6370', name: 'Yokogawa 6370' },
      { id: 'yoko-6377', name: 'Yokogawa 6377' },
      { id: 'yoko-6380', name: 'Yokogawa 6380' },
      { id: 'keysight-4200', name: 'Keysight 4200' },
      { id: 'keithley-2400-1', name: 'Keithley 2400 #1' },
      { id: 'keithley-2400-2', name: 'Keithley 2400 #2' },
      { id: 'keithley-2400-3', name: 'Keithley 2400 #3' },
      { id: 'keithley-2400-4', name: 'Keithley 2400 #4' },
      { id: 'keithley-2400-5', name: 'Keithley 2400 #5' }
    ];

    const API_URL = '/api/bookings';

    let bookedData = [];
    let selectedPlatform = '';
    let selectedDevices = [];

    const dateInput = document.getElementById('date');
    dateInput.min = new Date().toISOString().split('T')[0];

    window.addEventListener('DOMContentLoaded', () => {
      renderPlatformButtons();
      renderDeviceButtons();
      loadBookings();
      dateInput.addEventListener('change', updateOptions);
    });

    function renderPlatformButtons() {
      document.getElementById('platformGrid').innerHTML = PLATFORMS.map(p =>
        `<div class="sel-btn" data-id="${p.id}" onclick="selectPlatform('${p.id}')">${p.name}</div>`
      ).join('');
    }

    function renderDeviceButtons() {
      document.getElementById('deviceGrid').innerHTML = DEVICES.map(d =>
        `<div class="sel-btn" data-id="${d.id}" onclick="toggleDevice('${d.id}')">${d.name}</div>`
      ).join('');
    }

    function selectPlatform(id) {
      selectedPlatform = id;
      document.querySelectorAll('#platformGrid .sel-btn').forEach(el => {
        el.classList.toggle('active', el.dataset.id === id);
      });
      refreshCurrentSel();
      updateOptions();
    }

    function toggleDevice(id) {
      const idx = selectedDevices.indexOf(id);
      if (idx >= 0) {
        selectedDevices.splice(idx, 1);
      } else {
        selectedDevices.push(id);
      }
      document.querySelectorAll('#deviceGrid .sel-btn').forEach(el => {
        el.classList.toggle('active', selectedDevices.includes(el.dataset.id));
      });
      refreshCurrentSel();
      updateOptions();
    }

    function platformName(id) {
      const p = PLATFORMS.find(x => x.id === id);
      return p ? p.name : id;
    }

    function deviceName(id) {
      const d = DEVICES.find(x => x.id === id);
      return d ? d.name : id;
    }

    function refreshCurrentSel() {
      const el = document.getElementById('currentSel');
      if (selectedPlatform && selectedDevices.length) {
        const names = selectedDevices.map(d => deviceName(d)).join('、');
        el.innerHTML = `当前选择：<b>${platformName(selectedPlatform)}</b> 平台 · 设备（${selectedDevices.length}）：<b>${names}</b>`;
        el.classList.add('show');
      } else if (selectedPlatform) {
        el.innerHTML = `当前选择：<b>${platformName(selectedPlatform)}</b> 平台（请选择设备）`;
        el.classList.add('show');
      } else if (selectedDevices.length) {
        el.innerHTML = `已选设备（${selectedDevices.length}）：<b>${selectedDevices.map(d => deviceName(d)).join('、')}</b>（请选择平台）`;
        el.classList.add('show');
      } else {
        el.classList.remove('show');
      }
    }

    function formatDate(s) {
      if (!s) return '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const p = s.split('/');
      if (p.length === 3) return `${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`;
      const d = new Date(s);
      return isNaN(d) ? s : d.toISOString().split('T')[0];
    }

    async function loadBookings() {
      const listEl = document.getElementById('list');
      listEl.innerHTML = '<div class="empty">加载中...</div>';
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const safeData = Array.isArray(data) ? data : [];
        bookedData = safeData.map(i => ({ ...i, date: formatDate(i.date) }));
        renderList();
        updateOptions();
      } catch (e) {
        listEl.innerHTML = '<div class="empty">加载失败</div>';
      }
    }

    // 🌟 渲染列表结构也已调整
    function renderList() {
      const listEl = document.getElementById('list');
      if (!bookedData.length) {
        listEl.innerHTML = '<div class="empty">暂无预约记录</div>';
        return;
      }

      const today = new Date().toISOString().split('T')[0];
      const future = bookedData.filter(i => i.date >= today);

      if (!future.length) {
        listEl.innerHTML = '<div class="empty">暂无未来预约</div>';
        return;
      }

      let html = '';
      PLATFORMS.forEach(p => {
        const records = future
          .filter(i => i.platform === p.id)
          .sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));

        if (!records.length) return;

        html += `
          <div class="platform-group">
            <div class="platform-header">
              <span>${p.name} 平台</span>
              <span class="count">${records.length} 条</span>
            </div>
            <div class="platform-body">
              ${records.map(r => `
                <div class="record">
                  <div class="record-left">
                    <div class="record-row">
                      <span class="label">设备</span>
                      <span class="value">${deviceName(r.device)}</span>
                    </div>
                    <div class="record-row">
                      <span class="label">时间</span>
                      <span class="value" style="color: #555; font-weight: normal;">${r.date} ${r.time}</span>
                    </div>
                  </div>
                  <div class="record-right">
                    <div class="name">${r.name || '-'}</div>
                    <div class="phone">${r.phone || ''}</div>
                    <button class="btn-cancel-rec" onclick="cancelBooking('${r.id}', '${r.name}')">取消预约</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      listEl.innerHTML = html || '<div class="empty">暂无预约记录</div>';
    }

    async function cancelBooking(id, name) {
      if (!confirm(`确定要取消【${name}】的这条预约吗？`)) return;

      try {
        const res = await fetch(`${API_URL}?id=${id}`, { method: 'DELETE' });
        const result = await res.json();
        
        if (result.success) {
          showMsg(result.message, 'success');
          await loadBookings();
        } else {
          showMsg(result.message, 'error');
        }
      } catch (e) {
        showMsg('网络错误，取消失败', 'error');
      }
    }

    function updateOptions() {
      const d = dateInput.value;
      const sel = document.getElementById('time');
      const hint = document.getElementById('hint');
      const cur = sel.value;

      if (!selectedPlatform || !selectedDevices.length || !d) {
        Array.from(sel.options).forEach(o => {
          if (!o.value) return;
          o.disabled = false;
          o.textContent = o.value;
        });
        hint.classList.remove('show');
        return;
      }

      const takenTimes = new Set();
      const fullDayDevices = new Set();
      const partialDevices = new Set();

      selectedDevices.forEach(device => {
        const records = bookedData.filter(i =>
          i.platform === selectedPlatform && i.device === device && i.date === d
        );
        records.forEach(r => {
          if (r.time === '全天') fullDayDevices.add(device);
          else partialDevices.add(device);
        });
        if (records.length) takenTimes.add(device);
      });

      const anyFullDay = fullDayDevices.size > 0;

      Array.from(sel.options).forEach(o => {
        if (!o.value) return;
        let dis = false, txt = o.value;

        if (o.value === '全天') {
          if (takenTimes.size > 0) { dis = true; txt = '全天（已约）'; }
        } else {
          if (anyFullDay) { dis = true; txt = o.value + '（已约）'; }
          else {
            const conflict = selectedDevices.some(device =>
              bookedData.some(b =>
                b.platform === selectedPlatform && b.device === device &&
                b.date === d && b.time === o.value
              )
            );
            if (conflict) { dis = true; txt = o.value + '（已约）'; }
          }
        }
        o.disabled = dis;
        o.textContent = txt;
      });

      const curOpt = Array.from(sel.options).find(o => o.value === cur);
      if (curOpt && curOpt.disabled) sel.value = '';

      const totalRecords = bookedData.filter(i =>
        i.platform === selectedPlatform && i.date === d && selectedDevices.includes(i.device)
      ).length;

      if (totalRecords > 0) {
        hint.textContent = `所选设备在该日期已有 ${totalRecords} 条预约记录`;
        hint.classList.add('show');
      } else {
        hint.classList.remove('show');
      }
    }

    async function submitBooking() {
      const date = dateInput.value;
      const time = document.getElementById('time').value;
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const note = document.getElementById('note').value.trim();
      const btn = document.getElementById('btn');

      if (!selectedPlatform) return showMsg('请选择光学平台', 'error');
      if (!selectedDevices.length) return showMsg('请至少选择一台设备', 'error');
      if (!date || !time || !name || !phone) return showMsg('请填写完整信息', 'error');
      if (!/^1[3-9]\d{9}$/.test(phone)) return showMsg('请输入正确的手机号', 'error');

      btn.disabled = true;
      btn.textContent = '提交中...';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            platform: selectedPlatform,
            devices: selectedDevices,
            date, time, name, phone, note
          })
        });
        const result = await res.json();

        if (result.success) {
          showMsg(result.message, 'success');
          document.getElementById('name').value = '';
          document.getElementById('phone').value = '';
          document.getElementById('note').value = '';
          await loadBookings();
        } else {
          showMsg(result.message, 'error');
        }
      } catch (e) {
        showMsg('网络错误，请稍后重试', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '提交预约';
      }
    }

    function showMsg(t, type) {
      const el = document.getElementById('msg');
      el.textContent = t;
      el.className = 'message ' + type;
      setTimeout(() => el.className = 'message', 4000);
    }
  </script>
</body>
</html>
