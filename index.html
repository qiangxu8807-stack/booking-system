<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线预约系统</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { background: #fff; max-width: 520px; width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 28px; }
    h1 { font-size: 22px; text-align: center; margin-bottom: 24px; }
    label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; margin-top: 16px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    button { width: 100%; margin-top: 24px; padding: 12px; background: #1677ff; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:hover { background: #0958d9; }
    button:disabled { background: #a0c4ff; cursor: not-allowed; }
    .message { margin-top: 16px; padding: 10px; border-radius: 8px; text-align: center; display: none; }
    .success { background: #e6f7e6; color: #237804; display: block; }
    .error { background: #fff1f0; color: #cf1322; display: block; }
    .panel { margin-top: 24px; border-top: 1px dashed #e8e8e8; padding-top: 16px; }
    .panel-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .refresh { font-size: 13px; color: #1677ff; cursor: pointer; font-weight: normal; }
    .list { max-height: 200px; overflow-y: auto; border: 1px solid #f0f0f0; border-radius: 8px; background: #fafafa; }
    .item { display: flex; justify-content: space-between; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
    .item:last-child { border-bottom: none; }
    .empty { padding: 20px; text-align: center; color: #999; font-size: 13px; }
    .hint { margin-top: 6px; font-size: 13px; color: #fa8c16; display: none; }
    .hint.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📅 在线预约</h1>

    <label>选择日期</label>
    <input type="date" id="date">
    <div class="hint" id="hint"></div>

    <label>选择时间段</label>
    <select id="time">
      <option value="">请选择时间段</option>
      <option>全天</option>
      <option>09:00-10:00</option>
      <option>10:00-11:00</option>
      <option>11:00-12:00</option>
      <option>14:00-15:00</option>
      <option>15:00-16:00</option>
      <option>16:00-17:00</option>
    </select>

    <label>姓名</label>
    <input type="text" id="name" placeholder="请输入您的姓名">

    <label>电话</label>
    <input type="tel" id="phone" placeholder="请输入手机号">

    <label>备注（选填）</label>
    <textarea id="note" rows="3" placeholder="有什么特殊需求可以在这里说明"></textarea>

    <button id="btn" onclick="submitBooking()">提交预约</button>
    <div id="msg" class="message"></div>

    <div class="panel">
      <div class="panel-title">
        <span>已预约时段</span>
        <span class="refresh" onclick="loadBookings()">🔄 刷新</span>
      </div>
      <div class="list" id="list"><div class="empty">加载中...</div></div>
    </div>
  </div>

  <script>
    const API_URL = '/.netlify/functions/bookings';

    let bookedData = [];
    const dateInput = document.getElementById('date');
    dateInput.min = new Date().toISOString().split('T')[0];

    window.addEventListener('DOMContentLoaded', () => {
      loadBookings();
      dateInput.addEventListener('change', updateOptions);
    });

    function formatDate(s) {
      if (!s) return '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const p = s.split('/');
      if (p.length === 3) return `${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`;
      const d = new Date(s);
      return isNaN(d) ? s : d.toISOString().split('T')[0];
    }

    async function loadBookings() {
      const listEl = document.getElementById('list');
      listEl.innerHTML = '<div class="empty">加载中...</div>';
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        bookedData = (data || []).map(i => ({ ...i, date: formatDate(i.date) }));
        renderList();
        updateOptions();
      } catch (e) {
        listEl.innerHTML = '<div class="empty">加载失败</div>';
      }
    }

    function renderList() {
      const listEl = document.getElementById('list');
      if (!bookedData.length) {
        listEl.innerHTML = '<div class="empty">暂无预约记录</div>';
        return;
      }
      const sorted = [...bookedData].sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
      listEl.innerHTML = sorted.map(i => `<div class="item"><span>${i.date}</span><span style="color:#888">${i.time}</span></div>`).join('');
    }

    function updateOptions() {
      const d = dateInput.value;
      const sel = document.getElementById('time');
      const hint = document.getElementById('hint');
      const cur = sel.value;
      const times = bookedData.filter(i => i.date === d).map(i => i.time);
      const hasFull = times.includes('全天');
      const hasPartial = times.some(t => t !== '全天');

      Array.from(sel.options).forEach(o => {
        if (!o.value) return;
        let dis = false, txt = o.value;
        if (o.value === '全天') {
          if (hasFull || hasPartial) { dis = true; txt = '全天（已约）'; }
        } else {
          if (hasFull || times.includes(o.value)) { dis = true; txt = o.value + '（已约）'; }
        }
        o.disabled = dis;
        o.textContent = txt;
      });
      const curOpt = Array.from(sel.options).find(o => o.value === cur);
      if (curOpt && curOpt.disabled) sel.value = '';

      if (d && times.length) {
        hint.textContent = hasFull ? '该日期已被预约（全天）' : `该日期已有 ${times.length} 个时段被预约`;
        hint.classList.add('show');
      } else {
        hint.classList.remove('show');
      }
    }

    async function submitBooking() {
      const date = dateInput.value;
      const time = document.getElementById('time').value;
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const note = document.getElementById('note').value.trim();
      const btn = document.getElementById('btn');

      if (!date || !time || !name || !phone) return showMsg('请填写完整信息', 'error');
      if (!/^1[3-9]\d{9}$/.test(phone)) return showMsg('请输入正确的手机号', 'error');

      btn.disabled = true;
      btn.textContent = '提交中...';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ date, time, name, phone, note })
        });
        const result = await res.json();

        if (result.success) {
          showMsg(result.message, 'success');
          document.getElementById('name').value = '';
          document.getElementById('phone').value = '';
          document.getElementById('note').value = '';
          await loadBookings();
        } else {
          showMsg(result.message, 'error');
        }
      } catch (e) {
        showMsg('网络错误，请稍后重试', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '提交预约';
      }
    }

    function showMsg(t, type) {
      const el = document.getElementById('msg');
      el.textContent = t;
      el.className = 'message ' + type;
      setTimeout(() => el.className = 'message', 4000);
    }
  </script>
</body>
</html>
